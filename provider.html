<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Provider – LocalServe</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="logo">🔧 LocalServe</a>
    <nav>
      <a href="index.html">Find Services</a>
      <a href="register.html" class="btn btn-small">Register as Provider</a>
    </nav>
  </header>

  <div id="demo-banner" class="demo-banner hidden">
    Demo mode: data is saved only in this browser.
  </div>

  <main class="container narrow">
    <a href="index.html" class="back">← Back to search</a>

    <div id="profile" class="card profile">
      <p class="muted">Loading…</p>
    </div>

    <section class="card">
      <h2>Reviews</h2>
      <div id="reviews"><p class="muted">Loading…</p></div>

      <h3>Write a review</h3>
      <form id="review-form" class="form">
        <label>Your name
          <input type="text" id="r-name" required maxlength="50">
        </label>
        <label>Rating
          <select id="r-rating" required>
            <option value="5">★★★★★ – Excellent</option>
            <option value="4">★★★★ – Good</option>
            <option value="3">★★★ – Okay</option>
            <option value="2">★★ – Poor</option>
            <option value="1">★ – Bad</option>
          </select>
        </label>
        <label>Comment
          <textarea id="r-comment" rows="3" maxlength="500" required></textarea>
        </label>
        <button type="submit" class="btn">Submit review</button>
        <p id="r-msg" class="msg"></p>
      </form>
    </section>
  </main>

  <footer class="footer">© LocalServe – a simple local service finder</footer>

  <script type="module" src="js/provider.js"></script>
</body>
</html>
